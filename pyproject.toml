[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "portal-zdravlja-export"
version = "1.0.0"
description = "Preuzimanje svih vlastitih nalaza s Portala zdravlja (e-Građani) kao PDF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28",
    "lz4>=4.0",
]

[project.urls]
Homepage = "https://github.com/nalazi-export/portal-zdravlja-export"

[project.scripts]
portal-zdravlja-export = "pz_download:main"

[tool.setuptools]
# Flat layout: two top-level modules, no package directory.
py-modules = ["pz_download", "pz_cookie"]
